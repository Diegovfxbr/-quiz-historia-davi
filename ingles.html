<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado de Inglês - Davi</title><style>body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#172033}.w{max-width:700px;margin:auto;padding:18px}.c{background:#fff;padding:22px;border-radius:18px;box-shadow:0 4px 20px #0001;margin:12px 0}button{width:100%;padding:15px;margin:7px 0;border:2px solid #dbe2ee;border-radius:13px;background:white;font-size:17px}.main{background:#172033;color:white}.ok{background:#dff7e7;border-color:#38a169}.bad{background:#ffe1e1;border-color:#d84f4f}.hide{display:none}.top{display:flex;justify-content:space-between}.muted{color:#667085;font-size:14px}</style></head><body><div class="w"><div class="c" id="s"><h1>Simulado de Inglês</h1><p>Roupas, clima e estações do ano</p><p class="muted">25 perguntas sorteadas • 2 alternativas • correção na hora • refazer as erradas</p><button class="main" onclick="start()">Começar</button></div><div id="z" class="hide"><div class="top"><b id="p"></b><b id="sc"></b></div><div class="c"><h2 id="q"></h2><div id="ans"></div><p id="fb"></p><button class="main hide" id="nx" onclick="next()">Próxima</button></div></div><div class="c hide" id="r"></div></div><script>const bank=[
['O que significa <b>coat</b>?','casaco','vestido'],['O que significa <b>dress</b>?','vestido','saia'],['O que significa <b>cap</b>?','boné','chapéu'],['O que significa <b>hat</b>?','chapéu','boné'],['O que significa <b>shorts</b>?','shorts','calça'],['O que significa <b>boots</b>?','botas','sandálias'],['O que significa <b>turtleneck</b>?','blusa de gola alta','camiseta'],['O que significa <b>T-shirt</b>?','camiseta','casaco'],['O que significa <b>sandals</b>?','sandálias','botas'],['O que significa <b>pants</b>?','calças','saia'],['O que significa <b>skirt</b>?','saia','vestido'],['O que significa <b>sweater</b>?','suéter','maiô'],['O que significa <b>blouse</b>?','blusa','boné'],['O que significa <b>swimsuit</b>?','maiô','casaco'],['O que significa <b>scarf</b>?','cachecol','luvas'],['O que significa <b>gloves</b>?','luvas','botas'],['O que significa <b>umbrella</b>?','guarda-chuva','chapéu'],['Qual palavra em inglês corresponde a <b>casaco</b>?','coat','dress'],['Qual palavra em inglês corresponde a <b>vestido</b>?','dress','skirt'],['Qual palavra em inglês corresponde a <b>boné</b>?','cap','hat'],['Qual palavra em inglês corresponde a <b>botas</b>?','boots','sandals'],['Qual palavra em inglês corresponde a <b>calças</b>?','pants','shorts'],['Qual palavra em inglês corresponde a <b>saia</b>?','skirt','blouse'],['Qual palavra em inglês corresponde a <b>cachecol</b>?','scarf','cap'],['Qual palavra em inglês corresponde a <b>luvas</b>?','gloves','sandals'],["Complete: <b>When it's hot, I wear a _____.</b>",'T-shirt','coat'],["Complete: <b>When it's cold, I wear a _____.</b>",'coat','swimsuit'],['Complete: <b>At the beach I wear _____.</b>','a big hat','boots'],['Complete: <b>During winter we _____.</b>','wear hat and gloves','wear swimsuits'],["Complete: <b>It's a rainy day. _____.</b>",'Take your umbrella.','Wear sandals.'],['Complete: <b>I wear shorts and a T-shirt on _____.</b>','summer days','winter days'],["Complete: <b>It's warm today. _____.</b>","It's spring time.","It's very cold today."],['Se está <b>raining</b>, como está o tempo?','chovendo','ensolarado'],['Se está <b>cold</b>, como está o tempo?','frio','quente'],['Se está <b>hot</b>, como está o tempo?','quente','frio'],['O que significa <b>summer</b>?','verão','inverno'],['O que significa <b>winter</b>?','inverno','primavera'],['O que significa <b>spring</b>?','primavera','outono'],['O que significa <b>fall</b>?','outono','verão'],['Qual frase significa <b>Está chovendo!</b>?',"It's raining!","It's windy!"],['Qual frase significa <b>Está ventando!</b>?',"It's windy!","It's raining!"],['Qual frase significa <b>Está muito frio hoje.</b>?',"It's very cold today.","It's warm today."],['Qual frase significa <b>Pegue seu guarda-chuva.</b>?','Take your umbrella.','Wear your hat.'],['Na frase <b>She is wearing a dress and a hat</b>, o que ela está usando?','um vestido e um chapéu','uma saia e um boné'],['Na frase <b>He is wearing a T-shirt and shorts</b>, o que ele está usando?','uma camiseta e shorts','um casaco e calças'],['No Hemisfério Norte, o Natal em dezembro acontece durante qual estação?','winter','summer'],['No Hemisfério Sul, o Natal em dezembro acontece durante qual estação?','summer','winter'],['Em um dia frio, qual opção faz mais sentido usar?','coat and boots','T-shirt and sandals'],['Em um dia quente, qual opção faz mais sentido usar?','shorts and T-shirt','coat and gloves'],['Qual roupa é mais associada ao <b>winter</b>?','sweater','swimsuit'],['Qual roupa é mais associada ao <b>summer</b>?','swimsuit','turtleneck'],["Complete: <b>I am wearing a coat and boots because _____.</b>","it's very cold today","it's hot today"],["Complete: <b>It's raining! _____.</b>",'Take your umbrella.','Wear your swimsuit.'],['Qual palavra completa: <b>She is wearing a _____.</b> (Ela está usando um vestido.)','dress','coat'],['Qual palavra completa: <b>He is wearing _____.</b> (Ele está usando shorts.)','shorts','pants'],['O que significa <b>wear</b> neste conteúdo?','usar/vestir','comprar'],['O que significa <b>wearing</b> em <b>She is wearing...</b>?','está usando/vestindo','está comprando'],['Qual opção combina com <b>beach</b>?','swimsuit','gloves'],['Qual opção combina com um dia de <b>winter</b>?','boots and gloves','sandals and swimsuit']].map(x=>({q:x[0],a:x[1],b:x[2]}));let qs=[],i=0,score=0,wrong=[];const E=id=>document.getElementById(id);function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}function start(){qs=sh(bank).slice(0,25);i=0;score=0;wrong=[];E('s').classList.add('hide');E('r').classList.add('hide');E('z').classList.remove('hide');show()}function show(){let x=qs[i];E('p').textContent=`Pergunta ${i+1} de ${qs.length}`;E('sc').textContent=`Acertos: ${score}`;E('q').innerHTML=x.q;E('fb').textContent='';E('nx').classList.add('hide');E('ans').innerHTML='';sh([{t:x.a,o:1},{t:x.b,o:0}]).forEach(o=>{let b=document.createElement('button');b.textContent=o.t;b.onclick=()=>hit(b,o.o,x);E('ans').appendChild(b)})}function hit(b,ok,x){[...E('ans').children].forEach(e=>e.disabled=true);if(ok){score++;b.classList.add('ok');E('fb').textContent='Acertou!'}else{b.classList.add('bad');wrong.push(x);[...E('ans').children].forEach(e=>{if(e.textContent===x.a)e.classList.add('ok')});E('fb').textContent='Resposta certa: '+x.a}E('sc').textContent='Acertos: '+score;E('nx').classList.remove('hide')}function next(){if(++i<qs.length)show();else finish()}function finish(){E('z').classList.add('hide');E('r').classList.remove('hide');E('r').innerHTML=`<h2>Resultado: ${score}/${qs.length}</h2><p>Acertos: ${score} • Erros: ${wrong.length}</p>${wrong.length?'<button class="main" onclick="retry()">Refazer somente as erradas</button>':''}<button onclick="start()">Novo simulado: sortear outras 25</button>`}function retry(){qs=sh(wrong);wrong=[];i=0;score=0;E('r').classList.add('hide');E('z').classList.remove('hide');show()}</script></body></html>
