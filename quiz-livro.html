<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Em Busca da Coroa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f5a623,#ffd56a);color:#3b250d;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:18px}.hero,.card{background:#fffaf0;border-radius:24px;padding:22px;box-shadow:0 8px 22px #0002;margin-bottom:16px}.hero{text-align:center;border:4px solid #fff}h1{font-size:clamp(34px,8vw,62px);margin:8px 0;color:#8a4c0b}.crown{font-size:64px}.tag{font-weight:900;background:#ef8e17;color:white;padding:7px 13px;border-radius:20px;display:inline-block}.primary{width:100%;border:0;border-radius:16px;padding:15px;background:#8a4c0b;color:white;font-size:20px;font-weight:900}.secondary{border:2px solid #d9b47c;background:white;border-radius:14px;padding:12px;font-weight:800}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#fff0cf;padding:9px;border-radius:12px}.stat b{font-size:22px}.bar{height:11px;background:#eadcc4;border-radius:10px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:#ef8e17}.q{font-size:25px;font-weight:900;margin:18px 0}.options{display:grid;gap:12px}.option{border:2px solid #e2cda7;background:white;border-radius:16px;padding:16px;text-align:left;font-size:18px;font-weight:700}.correct{background:#dff5dd!important;border-color:#2f9b45!important}.wrong{background:#ffe0db!important;border-color:#c84b3f!important}.feedback{font-weight:900;min-height:28px;margin:12px 0}.nav{display:flex;gap:8px}.nav button{flex:1}.result{font-size:22px}.big{font-size:42px;font-weight:900}.ok{color:#27833b}.bad{color:#b33b30}@keyframes pop{50%{transform:scale(1.03)}}.pop{animation:pop .35s}</style></head><body><div class="wrap"><section class="hero"><div class="crown">👑</div><span class="tag">4º ANO • LEITURA</span><h1>Em Busca da Coroa</h1><p>Quiz de revisão do livro de Alcides Goulart</p><button class="primary" onclick="start()">▶ INICIAR QUIZ</button></section><section id="quiz" class="card hidden"><div class="stats"><div class="stat">Questão<br><b id="num"></b></div><div class="stat">Acertos<br><b id="hits">0</b></div><div class="stat">Erros<br><b id="miss">0</b></div></div><div class="bar"><i id="bar"></i></div><div id="q" class="q"></div><div id="opts" class="options"></div><div id="feed" class="feedback"></div><div class="nav"><button id="prev" class="secondary" onclick="prev()">← VOLTAR</button><button id="next" class="primary" onclick="next()" disabled>PRÓXIMA →</button></div></section><section id="result" class="card hidden result"><h2>Resultado final</h2><p><span class="big ok" id="fh"></span> acertos</p><p><span class="big bad" id="fm"></span> erros</p><p id="pct"></p><div class="nav"><button class="primary" onclick="start()">FAZER NOVAMENTE</button><button id="retry" class="secondary" onclick="retryWrong()">REFAZER ERRADAS</button></div></section></div><script>const ALL=[
['O que havia de diferente no reino de Coroado?','Havia muitos reis.','Havia apenas um rei.'],
['Quando um rapaz de Coroado recebia uma coroa de ouro?','Ao completar 21 anos.','Ao completar 18 anos.'],
['Quem era a autoridade máxima de Coroado?','O Rei de Todos.','O Rei da Imaginação.'],
['Quem distribuía as coroas e decidia quem seria rei de cada coisa?','O Rei de Todos.','O Rei da Beleza.'],
['Como vivia o Rei de Todos?','Em um enorme castelo, cercado de luxo, conforto e riqueza.','Em uma pequena casa, levando uma vida simples.'],
['Quem participava dos banquetes do Rei de Todos?','Somente o próprio rei.','Todos os moradores do reino.'],
['O que o Rei de Todos fazia durante grande parte do tempo?','Dava ordens e comia do bom e do melhor.','Trabalhava nas plantações do reino.'],
['Quem contava histórias para divertir o Rei de Todos?','O Rei da Imaginação.','O Rei da Velocidade.'],
['Quem entrou no salão e interrompeu o banquete do rei?','Cerca de vinte mulheres.','Um grupo de vinte reis.'],
['O que as mulheres foram pedir ao Rei de Todos?','O direito de também usar coroa e serem rainhas.','Mais comida para os banquetes.'],
['Como o rei reagiu inicialmente ao pedido das mulheres?','Riu e zombou do pedido.','Aceitou imediatamente.'],
['Segundo as mulheres, por que elas também deveriam ter direito à coroa?','Porque eram tão capazes quanto os homens e queriam os mesmos direitos.','Porque queriam vender as coroas.'],
['O Rei de Todos disse que sua própria lei permitia que as mulheres usassem coroa?','Não. Ele afirmou que sua lei não permitia.','Sim. Ele disse que sempre foi permitido.'],
['Que argumento o rei usou ao falar do pavão e do leão?','Tentou usar diferenças entre machos e fêmeas dos animais para justificar diferenças entre homens e mulheres.','Disse que todos os animais eram exatamente iguais.'],
['Como as mulheres responderam à comparação com os animais?','Disseram que pessoas têm raciocínio e inteligência para lutar por mudanças e corrigir injustiças.','Concordaram que não deveriam lutar por seus direitos.'],
['O que as mulheres disseram que estava na hora de construir?','Uma nova história.','Um novo castelo.'],
['Quanto tempo o rei disse primeiro que levaria para pensar no pedido?','Dois meses.','Dois dias.'],
['Depois da reclamação das mulheres, qual prazo o rei acabou dando?','Dois dias.','Dois anos.'],
['O rei realmente levou o pedido das mulheres a sério após elas saírem?','Não. Ele zombou dos sonhos delas.','Sim. Preparou coroas de ouro imediatamente.'],
['Quem o rei chamou para criar uma história zombando dos sonhos das mulheres?','O Rei da Imaginação.','O Rei da Economia.'],
['O que aconteceu depois que os dias passaram sem resposta do rei?','As mulheres voltaram ao castelo em maior número.','As mulheres desistiram para sempre.'],
['Quantas mulheres voltaram ao salão na semana seguinte?','Quarenta.','Dez.'],
['Qual grito passou a ser repetido pelas manifestantes?','COROA JÁ! COROA JÁ! COROA JÁ!','BANQUETE JÁ! BANQUETE JÁ!'],
['Por que o rei queria encontrar uma solução para os protestos?','Queria paz e sossego, principalmente durante seus banquetes.','Queria abandonar o castelo.'],
['O rei queria usar a força para retirar as quarenta mulheres?','Não. Procurava um meio de despachá-las sem usar a força.','Sim. Essa foi sua primeira escolha.'],
['O que o rei anunciou para tentar encerrar a situação?','Que as mulheres seriam autorizadas a usar coroa.','Que nenhuma mulher poderia entrar no castelo novamente.'],
['As mulheres ficaram felizes imediatamente ao ouvir que poderiam usar coroa?','Sim, houve festa, abraços e comemoração.','Não, todas saíram do salão em silêncio.'],
['A coroa oferecida às mulheres seria idêntica à dos homens?','Não. O rei disse que seria feita de outro material.','Sim. Seria de ouro exatamente igual.'],
['De que material o rei decidiu que seria a coroa feminina?','Lata.','Ouro maciço.'],
['Como as mulheres reagiram à proposta da coroa de lata?','Ficaram indignadas e consideraram falta de respeito.','Agradeceram e aceitaram sem protestar.'],
['Qual era o novo grito de protesto das mulheres?','NÃO QUEREMOS MIGALHA! ESTAMOS PRONTAS PRA BATALHA!','QUEREMOS APENAS COMIDA!'],
['Quem o Rei de Todos decidiu chamar para pedir ajuda?','O Rei dos Conselhos.','O Rei do Humor.']];
let qs=[],i=0,h=0,m=0,wrong=[],answered=[];const $=x=>document.getElementById(x);function sh(a){return [...a].sort(()=>Math.random()-.5)}function prep(arr){return sh(arr).map(x=>{let o=sh([{t:x[1],ok:1},{t:x[2],ok:0}]);return {q:x[0],o}})}function start(){qs=prep(ALL);i=h=m=0;wrong=[];answered=Array(qs.length).fill(null);$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){$('num').textContent=(i+1)+'/'+qs.length;$('hits').textContent=h;$('miss').textContent=m;$('bar').style.width=((i+1)/qs.length*100)+'%';$('q').textContent=qs[i].q;$('opts').innerHTML='';$('feed').textContent='';$('next').disabled=answered[i]===null;$('prev').disabled=i===0;qs[i].o.forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=o.t;if(answered[i]!==null){b.disabled=true;if(o.ok)b.classList.add('correct');if(j===answered[i]&&!o.ok)b.classList.add('wrong')}b.onclick=()=>answer(j,b);$('opts').appendChild(b)})}function answer(j,b){if(answered[i]!==null)return;answered[i]=j;let ok=qs[i].o[j].ok;if(ok){h++;b.classList.add('correct');$('feed').textContent='✓ Acertou!';$('feed').className='feedback ok pop'}else{m++;wrong.push(qs[i]);b.classList.add('wrong');[...$('opts').children].forEach((x,k)=>{if(qs[i].o[k].ok)x.classList.add('correct')});$('feed').textContent='✗ Errou. Veja a resposta correta.';$('feed').className='feedback bad pop'}$('hits').textContent=h;$('miss').textContent=m;$('next').disabled=false;[...$('opts').children].forEach(x=>x.disabled=true)}function next(){if(answered[i]===null)return;if(i<qs.length-1){i++;render()}else finish()}function prev(){if(i>0){i--;render()}}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('fh').textContent=h;$('fm').textContent=m;$('pct').textContent='Aproveitamento: '+Math.round(h/qs.length*100)+'%';$('retry').style.display=wrong.length?'block':'none'}function retryWrong(){qs=prep(wrong.map(x=>[x.q,x.o.find(o=>o.ok).t,x.o.find(o=>!o.ok).t]));i=h=m=0;wrong=[];answered=Array(qs.length).fill(null);$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}</script></body></html>
