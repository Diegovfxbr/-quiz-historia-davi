<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Português e Gramática - 4º Ano</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#6a3dc7,#4d87df);min-height:100vh;color:#27304a}.wrap{max-width:780px;margin:auto;padding:16px}.card{background:#fff;border-radius:24px;padding:20px;margin:10px 0;box-shadow:0 8px 24px #26336a55}.hero{text-align:center}.badge{display:inline-block;background:#ffdb59;padding:7px 12px;border-radius:12px;font-weight:900}.hero h1{font-size:clamp(34px,8vw,62px);margin:16px 0 5px;color:#5a35b4}.hero p{font-size:18px}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:18px;cursor:pointer}.main{background:#5a35b4;color:white;width:100%}.secondary{background:#eef0f8;color:#303650}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f0edff;border-radius:13px;padding:8px}.stat b{font-size:22px}.bar{height:10px;background:#e6e6ef;border-radius:20px;overflow:hidden;margin:12px 0}.bar i{height:100%;display:block;background:#ffb42d}.q{font-size:23px;font-weight:900;line-height:1.25;margin:15px 0}.opts{display:grid;gap:10px}.opt{padding:14px;text-align:left;border:2px solid #d8d8e5;background:white;border-radius:14px;font-size:17px;font-weight:700}.correct{background:#dff6df!important;border-color:#3da75a!important}.wrong{background:#ffe1df!important;border-color:#d55a50!important}.feedback{font-weight:900;min-height:28px;margin:12px 0}.nav{display:flex;gap:8px}.nav button{flex:1}.word{display:inline-block;border:2px solid #d8d8e5;border-radius:10px;padding:7px 9px;margin:4px;cursor:pointer;background:#fff}.word.selected{border:3px solid #5a35b4;background:#eee8ff;border-radius:50%}.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match button{padding:12px;border:2px solid #d8d8e5;border-radius:12px;background:#fff;font-weight:700}.match button.sel{border-color:#5a35b4;background:#eee8ff}.match button.done{background:#dff6df;border-color:#3da75a}.big{font-size:46px;font-weight:900}.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer{text-align:center;color:white;font-weight:bold;padding:12px}@keyframes pop{50%{transform:scale(1.04)}}.pop{animation:pop .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.shake{animation:shake .3s}@media(max-width:500px){.q{font-size:20px}.stats{font-size:13px}}</style></head><body><div class="wrap"><section id="home" class="card hero"><span class="badge">4º ANO • PROVA</span><h1>PORTUGUÊS<br>& GRAMÁTICA</h1><p>Treino interativo com atividades de tocar, circular e ligar.</p><p><b>Sem tempos verbais.</b></p><button class="btn main" onclick="start()">▶ INICIAR SIMULADO</button></section><section id="quiz" class="card hidden"><div class="stats"><div class="stat">Questão<br><b id="num"></b></div><div class="stat">Acertos<br><b id="hit">0</b></div><div class="stat">Erros<br><b id="miss">0</b></div></div><div class="bar"><i id="bar"></i></div><div id="area"></div><div id="fb" class="feedback"></div><div class="nav"><button id="back" class="btn secondary" onclick="prev()">← VOLTAR</button><button id="next" class="btn main" onclick="next()" disabled>PRÓXIMA →</button></div></section><section id="end" class="card hidden hero"><h2>Resultado final</h2><div class="result"><div class="stat"><div id="fh" class="big">0</div>ACERTOS</div><div class="stat"><div id="fm" class="big">0</div>ERROS</div></div><div class="stat" style="margin:12px 0"><div id="pct" class="big"></div>APROVEITAMENTO</div><button class="btn main" onclick="start()">FAZER NOVAMENTE</button><button id="retry" class="btn secondary" style="width:100%;margin-top:8px" onclick="retryWrong()">REFAZER SÓ AS ERRADAS</button></section><div class="footer">Revisão do Davi • Português e Gramática</div></div><script>const BASE=[{t:'choice',q:'Na frase “Meu caderno está na mochila”, qual é o pronome possessivo?',o:['Meu','na mochila'],a:0},{t:'choice',q:'Na frase “Aquela bicicleta é nova”, qual é o pronome demonstrativo?',o:['Aquela','nova'],a:0},{t:'choice',q:'Qual palavra é um pronome possessivo?',o:['Nossa','Esta'],a:0},{t:'choice',q:'Qual palavra é um pronome demonstrativo?',o:['Esse','Seu'],a:0},{t:'circle',q:'Toque para CIRCULAR o adjetivo: “A menina alegre brincou no pátio.”',words:['A','menina','alegre','brincou','no','pátio.'],a:2},{t:'circle',q:'Toque para CIRCULAR a locução adjetiva: “Comprei uma roupa de festa.”',words:['Comprei','uma','roupa','de festa.'],a:3},{t:'choice',q:'“Voz de homem” pode ser substituída por:',o:['voz masculina','voz solar'],a:0},{t:'choice',q:'“Caminhada de noite” pode ser substituída por:',o:['caminhada noturna','caminhada juvenil'],a:0},{t:'choice',q:'“Brilho do sol” pode ser substituído por:',o:['brilho solar','brilho maternal'],a:0},{t:'match',q:'LIGUE cada locução ao adjetivo correto.',pairs:[['de homem','masculina'],['do sol','solar'],['de festa','festiva']]},{t:'choice',q:'Na oração “Marta e Fernanda saíram cedo para o trabalho”, qual é o sujeito?',o:['Marta e Fernanda','saíram cedo para o trabalho'],a:0},{t:'choice',q:'Na oração “O cachorro brincou no quintal”, qual é o predicado?',o:['brincou no quintal','O cachorro'],a:0},{t:'choice',q:'Em “Papel e vidro são materiais recicláveis”, qual é o sujeito?',o:['Papel e vidro','são materiais recicláveis'],a:0},{t:'choice',q:'Em “Uma artista famosa apresentou-se no teatro”, qual é o predicado?',o:['apresentou-se no teatro','Uma artista famosa'],a:0},{t:'choice',q:'Em “Ontem choveu muito”, o verbo indica:',o:['fenômeno da natureza','ação'],a:0},{t:'choice',q:'Em “Pedro está nervoso”, o verbo indica:',o:['estado','fenômeno da natureza'],a:0},{t:'choice',q:'Em “A tinta manchou o papel”, o verbo indica:',o:['ação','estado'],a:0},{t:'choice',q:'Em “Anoiteceu rapidamente”, o verbo indica:',o:['fenômeno da natureza','estado'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['rapidez','rapides'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['pobreza','pobresa'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['francesa','franceza'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['enxoval','enchoval'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['machucado','maxucado'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['mexer','mecher'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['flecha','flexa'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['expressão','expresão'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['compreensão','compreenção'],a:0},{t:'choice',q:'Qual palavra está escrita corretamente?',o:['contenção','contensão'],a:0}];let qs=[],i=0,ans={},wrong=[],matchState={};const $=x=>document.getElementById(x);function sh(a){for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function prep(list){return sh(list.map(x=>{let z=JSON.parse(JSON.stringify(x));if(z.t==='choice'){let correct=z.o[z.a];sh(z.o);z.a=z.o.indexOf(correct)}if(z.t==='match')sh(z.pairs);return z}))}function start(){qs=prep(BASE);i=0;ans={};wrong=[];$('home').classList.add('hidden');$('end').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function score(){let h=Object.values(ans).filter(x=>x===true).length,m=Object.values(ans).filter(x=>x===false).length;$('hit').textContent=h;$('miss').textContent=m;return[h,m]}function render(){let x=qs[i];$('num').textContent=(i+1)+' / '+qs.length;$('bar').style.width=(i/qs.length*100)+'%';$('fb').textContent='';$('next').disabled=ans[i]===undefined;$('back').disabled=i===0;let h='<div class="q">'+x.q+'</div>';if(x.t==='choice'){h+='<div class="opts">'+x.o.map((v,k)=>`<button class="opt" onclick="pick(${k},this)">${v}</button>`).join('')+'</div>'}else if(x.t==='circle'){h+='<div>'+x.words.map((v,k)=>`<span class="word" onclick="circle(${k},this)">${v}</span>`).join(' ')+'</div>'}else{matchState={sel:null,done:[]};let L=sh(x.pairs.map((p,k)=>({v:p[0],k}))),R=sh(x.pairs.map((p,k)=>({v:p[1],k})));h+='<p>Toque em um item da esquerda e depois no correspondente da direita.</p><div class="match"><div>'+L.map(v=>`<button id="l${v.k}" onclick="ml(${v.k},this)">${v.v}</button>`).join('<br>')+'</div><div>'+R.map(v=>`<button id="r${v.k}" onclick="mr(${v.k},this)">${v.v}</button>`).join('<br>')+'</div></div>'}$('area').innerHTML=h;if(ans[i]!==undefined){$('next').disabled=false;$('fb').textContent=ans[i]?'✓ Você acertou esta questão.':'✗ Esta questão ficou marcada como errada.'}score()}function mark(ok,el){ans[i]=ok;el.classList.add(ok?'correct':'wrong');$('fb').textContent=ok?'✓ Muito bem! Resposta correta.':'✗ Não foi dessa vez. Tente novamente ou avance.';$('quiz').classList.add(ok?'pop':'shake');setTimeout(()=>$('quiz').classList.remove('pop','shake'),350);$('next').disabled=false;score()}function pick(k,el){let ok=k===qs[i].a;mark(ok,el);if(!ok)setTimeout(()=>{[...document.querySelectorAll('.opt')][qs[i].a].classList.add('correct')},200)}function circle(k,el){document.querySelectorAll('.word').forEach(w=>w.classList.remove('selected','correct','wrong'));el.classList.add('selected');mark(k===qs[i].a,el)}function ml(k,e){if(matchState.done.includes(k))return;document.querySelectorAll('.match button').forEach(b=>b.classList.remove('sel'));matchState.sel=k;e.classList.add('sel')}function mr(k,e){if(matchState.sel===null)return;let s=matchState.sel;if(s===k){matchState.done.push(k);$('l'+k).classList.add('done');$('r'+k).classList.add('done');$('fb').textContent='✓ Ligação correta!';if(matchState.done.length===qs[i].pairs.length){ans[i]=true;$('next').disabled=false;score()}}else{$('fb').textContent='✗ Essa ligação não corresponde. Tente outra.';$('quiz').classList.add('shake');setTimeout(()=>$('quiz').classList.remove('shake'),350)}matchState.sel=null}function next(){if(i<qs.length-1){i++;render()}else finish()}function prev(){if(i>0){i--;render()}}function finish(){let [h,m]=score();wrong=qs.filter((x,k)=>ans[k]!==true);$('quiz').classList.add('hidden');$('end').classList.remove('hidden');$('fh').textContent=h;$('fm').textContent=qs.length-h;$('pct').textContent=Math.round(h/qs.length*100)+'%';$('retry').disabled=!wrong.length}function retryWrong(){if(!wrong.length)return;qs=prep(wrong);i=0;ans={};wrong=[];$('end').classList.add('hidden');$('quiz').classList.remove('hidden');render()}</script></body></html>
