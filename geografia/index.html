<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado de Geografia - Davi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff3ff,#e8f7df);color:#18364a}.wrap{max-width:780px;margin:auto;padding:18px}.hero,.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 25px #0002;margin-bottom:16px}h1{margin:0;color:#176b52;font-size:clamp(32px,8vw,58px)}.tag{display:inline-block;background:#e8f4ff;padding:7px 11px;border-radius:999px;font-weight:800;margin-bottom:10px}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:#167d5a;color:white;font-weight:900;font-size:20px}.secondary{border:2px solid #ccd9df;background:white;border-radius:12px;padding:11px;font-weight:800}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#eef7f2;border-radius:12px;padding:9px}.stat b{font-size:22px}.bar{height:10px;background:#e4ecef;border-radius:20px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:#f2a51a}.q{font-size:24px;font-weight:900;margin:16px 0}.opts{display:grid;gap:10px}.opt{padding:15px;border:2px solid #dbe4e8;background:#fff;border-radius:14px;text-align:left;font-size:17px;font-weight:700}.opt.ok{background:#dcf6df;border-color:#3a9d52}.opt.bad{background:#ffe0dc;border-color:#c95747}.feedback{font-weight:800;min-height:30px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.big{font-size:44px;font-weight:900;text-align:center}.note{font-size:14px;color:#58707d}</style></head><body><div class="wrap"><section class="hero"><span class="tag">4º ANO • GEOGRAFIA</span><h1>SIMULADO DE GEOGRAFIA</h1><p>25 perguntas sorteadas a cada tentativa. Duas alternativas, correção na hora e opção para refazer somente as erradas.</p><button class="primary" id="start">INICIAR SIMULADO</button></ let qs=[],i=0,h=0,m=0,wrong=[];const $=x=>document.getElementById(x);function sh(a){return [...a].sort(()=>Math.random()-.5)}function prepare(list=null){qs=list?sh(list):sh(B).slice(0,25);i=h=m=0;wrong=[];$('hits').textContent=0;$('miss').textContent=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){let x=qs[i];$('n').textContent=i+1;$('bar').style.width=((i)/qs.length*100)+'%';$('q').textContent=x[0];$('fb').textContent='';$('next').disabled=true;let choices=[{t:x[1],ok:x[3]===0},{t:x[2],ok:x[3]===1}];choices=sh(choices);$('opts').innerHTML='';choices.forEach(c=>{let b=document.createElement('button');b.className='opt';b.textContent=c.t;b.onclick=()=>answer(b,c.ok,x);$('opts').appendChild(b)})}function answer(btn,ok,x){[...$('opts').children].forEach(b=>b.disabled=true);if(ok){h++;btn.classList.add('ok');$('fb').textContent='Acertou! Muito bem.'}else{m++;wrong.push(x);btn.classList.add('bad');[...$('opts').children].forEach(b=>{if(b!==btn)b.classList.add('ok')});$('fb').textContent='Errou. Veja a resposta correta destacada.'}$('hits').textContent=h;$('miss').textContent=m;$('next').disabled=false}$('next').onclick=()=>{i++;if(i<qs.length)render();else finish()};function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let p=Math.round(h/qs.length*100);$('score').textContent=h+' / '+qs.length+' ('+p+'%)';$('msg').textContent=p>=80?'Ótimo resultado!':p>=60?'Bom trabalho. Refaça as erradas para fixar.':'Vale revisar e refazer as questões erradas.';$('wrong').disabled=!wrong.length}$('start').onclick=()=>prepare();$('again').onclick=()=>prepare();$('wrong').onclick=()=>{if(wrong.length)prepare([...wrong])};
